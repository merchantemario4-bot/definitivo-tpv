<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROLLO TPV - Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="style.css?v=20261021">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans">

    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-normal text-slate-950">ROLLO TPV</h1>
                <p class="text-sm text-slate-600">Rollos térmicos para hostelería y comercio</p>
            </div>
            <div id="contador-carrito" aria-live="polite" class="inline-flex w-fit items-center rounded-full border border-emerald-200 bg-emerald-50 px-4 py-2 text-sm font-bold text-emerald-800">
                0 cajas · 0,00 €
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 lg:grid lg:grid-cols-[minmax(0,1fr)_380px] lg:items-start lg:gap-8">
        <section aria-labelledby="catalogo-titulo">
            <div class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <h2 id="catalogo-titulo" class="text-xl font-black text-slate-950">Ofertas de rollos TPV</h2>
                    <p class="text-sm text-slate-600">Elige tu oferta, rellena tus datos y envía el pedido.</p>
                    <p class="mt-2 text-sm font-bold text-emerald-800">Todos los precios incluyen IVA.</p>
                </div>
            </div>

            <div id="contenedor-productos" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
            </div>
        </section>

        <aside id="seccion-pedido" class="pedido-panel hidden mt-8 lg:mt-0 lg:sticky lg:top-24">
            <div class="mb-5 flex items-center justify-between gap-3">
                <div>
                    <h2 class="text-xl font-black text-slate-950">Tu pedido</h2>
                    <p id="resumen-unidades" class="text-sm text-slate-600">0 cajas seleccionadas</p>
                </div>
            </div>

            <div id="lista-seleccionados" class="mb-6 divide-y divide-slate-200 rounded-lg border border-slate-200 bg-slate-50">
            </div>

            <div class="pedido-total" aria-live="polite">
                <div><strong>Total del pedido</strong><span>IVA incluido</span></div>
                <strong id="total-pedido">0,00 €</strong>
            </div>

            <form id="formulario-pedido" class="space-y-4">
                <div>
                    <label for="nombre" class="block text-sm font-bold text-slate-700 mb-1">Nombre</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Tu nombre" required
                        class="campo-formulario">
                </div>

                <div>
                    <label for="telefono" class="block text-sm font-bold text-slate-700 mb-1">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="WhatsApp o móvil" required
                        class="campo-formulario">
                </div>

                <div>
                    <label for="direccion" class="block text-sm font-bold text-slate-700 mb-1">Dirección de envío</label>
                    <input type="text" id="direccion" name="direccion" autocomplete="street-address" placeholder="Calle, número, código postal..." required
                        class="campo-formulario">
                </div>

                <button type="submit" id="btn-enviar" class="btn-enviar">
                    Enviar pedido
                </button>

                <p id="mensaje-estado" class="hidden rounded-lg px-3 py-2 text-sm font-semibold" role="status"></p>
            </form>
        </aside>
    </main>

    <footer class="max-w-6xl mx-auto px-4 pb-8 text-xs text-slate-500">
        ROLLO TPV
    </footer>

    <script src="script.js?v=20261021"></script>
</body>
</html>
